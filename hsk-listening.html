<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3.0 듣기 전체</title><style>body{margin:0;background:#f5f1f8;color:#30233c;font:17px/1.7 system-ui,sans-serif}main{max-width:620px;margin:36px auto;padding:28px;background:white;border-radius:16px}h1{color:#653094;font-size:30px}label{display:block;margin-top:16px;font-weight:bold}select,button{font:inherit;padding:12px;border-radius:8px}select,audio{width:100%;box-sizing:border-box}button{background:#653094;color:white;border:0;margin:12px 6px 6px 0;cursor:pointer}li{margin:8px 0}a{color:#653094}.note{font-size:14px;color:#62596a}@media(max-width:680px){main{margin:16px;padding:22px}}</style><main><h1 id="heading">HSK3.0 듣기 전체</h1><label for="level">급수</label><select id="level"></select><label for="set">회차</label><select id="set"></select><p>재생 버튼을 누르면 이 회차의 듣기를 첫 부분부터 마지막 부분까지 순서대로 재생합니다.</p><h2 id="current"></h2><audio id="audio" controls preload="metadata"></audio><button id="start">처음부터 전체 듣기</button><p id="status" role="status"></p><ol id="tracks"></ol><p class="note">기존 교재의 중국어 합성 음원입니다. 문항 사이의 무음은 풀이 시간입니다. 부분 사이에서 재생이 멈추면 재생 버튼을 눌러 주세요.</p></main><script>
const level=document.querySelector('#level'),set=document.querySelector('#set'),audio=document.querySelector('#audio'),status=document.querySelector('#status'),current=document.querySelector('#current');
for(let i=1;i<=6;i++)level.add(new Option(i+'급',i));for(let i=1;i<=10;i++)set.add(new Option('제'+i+'회',i));
const q=new URLSearchParams(location.search);level.value=String(Math.min(6,Math.max(1,Number(q.get('level'))||1)));set.value=String(Math.min(10,Math.max(1,Number(q.get('set'))||1)));
const base='https://raw.githubusercontent.com/yanchunnu/-/main/';let files=[],index=0;
function makeFiles(l,s){const n=String(s).padStart(2,'0');if(l===1)return [1,2,3].map(p=>'hsk1-set'+n+'-part'+p+'.mp3');if(l===2)return ['set-'+n+'.mp3'];if(l===6)return ['hsk6-set'+n+'-listen.mp3'];return (l===3?['l1','l2','l3']:['l1','l2']).map(p=>'hsk'+l+'-set'+n+'-'+p+'.mp3')}
function load(i,play){index=i;audio.src=base+files[i];current.textContent=files.length===1?'듣기 전체':'듣기 제'+(i+1)+'부분 / '+files.length+'부분';status.textContent=play?'다음 부분을 재생합니다.':'재생 버튼을 눌러 주세요.';if(play)audio.play().catch(()=>status.textContent='재생 버튼을 누르면 이어서 들을 수 있습니다.')}
function choose(){audio.pause();files=makeFiles(Number(level.value),Number(set.value));document.querySelector('#heading').textContent='HSK3.0 '+level.value+'급 · 제'+set.value+'회';document.title=document.querySelector('#heading').textContent+' 듣기 전체';const list=document.querySelector('#tracks');list.replaceChildren();files.forEach((f,i)=>{let li=document.createElement('li'),a=document.createElement('a');a.href=base+f;a.textContent=files.length===1?'전체 음원 열기':'제'+(i+1)+'부분 음원 열기';li.append(a);list.append(li)});history.replaceState(null,'','?level='+level.value+'&set='+set.value);load(0,false)}
level.onchange=set.onchange=choose;document.querySelector('#start').onclick=()=>load(0,true);audio.onended=()=>{if(index+1<files.length)load(index+1,true);else status.textContent='이 회차의 듣기 전체를 마쳤습니다.'};audio.onplaying=()=>status.textContent='재생 중입니다.';audio.onerror=()=>status.textContent='음원을 불러오지 못했습니다. 인터넷 연결을 확인하거나 아래 음원 링크를 이용해 주세요.';choose();
</script></html>
