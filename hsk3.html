<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3.0 3급 모의고사 음원</title><style>*{box-sizing:border-box}body{font:17px/1.6 system-ui,sans-serif;margin:0;background:#edf3f7;color:#15334a}main{max-width:640px;margin:8vh auto;padding:30px;background:white;border-top:6px solid #174c68;border-radius:12px}h1{font-size:26px;margin:0 0 24px}label{display:block;margin-top:16px;font-weight:600}select,audio{width:100%;margin:8px 0 18px}select{padding:12px;font:inherit;border:1px solid #8093a1;border-radius:6px;background:white}p{margin:8px 0}a{color:#145780}#status{font-size:15px;color:#536674}details{margin-top:24px;border-top:1px solid #ccd8df;padding-top:16px}small{display:block;margin-top:20px;color:#596c7b}@media(max-width:680px){main{margin:24px 12px;padding:22px}}</style><main><h1>HSK3.0 3급 모의고사 음원</h1><label for="set">회차</label><select id="set"></select><label for="part">시험 부분</label><select id="part"><option value="l1">听力 第一部分</option><option value="l2">听力 第二部分</option><option value="l3">听力 第三部分</option><option value="s1">口语 第一部分 · 听后重复</option><option value="s2">口语 第二部分 · 看图说话</option><option value="s3">口语 第三部分 · 回答问题</option></select><h2 id="heading" style="font-size:20px"></h2><audio id="audio" controls preload="metadata"></audio><p id="status" role="status">음원을 준비하고 있습니다.</p><a id="download" download>MP3 내려받기</a><details id="review" hidden><summary>시험 후 복습용 모범 답안</summary><p>시험 중에는 재생하지 마세요.</p><audio id="model" controls preload="none"></audio></details><small>표준중국어 합성 음성입니다. 말하기 준비 시간 6분은 별도로 제공합니다.</small></main><script>
const set=document.querySelector('#set'),part=document.querySelector('#part'),audio=document.querySelector('#audio'),model=document.querySelector('#model'),review=document.querySelector('#review'),status=document.querySelector('#status');
for(let i=1;i<=10;i++){let o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent=`제${i}회`;set.append(o)}
const q=new URLSearchParams(location.search);if([...set.options].some(o=>o.value===q.get('set')))set.value=q.get('set');if([...part.options].some(o=>o.value===q.get('part')))part.value=q.get('part');
function update(){audio.pause();model.pause();const file=`hsk3-set${set.value}-${part.value}.mp3`;audio.src=file;document.querySelector('#download').href=file;document.querySelector('#heading').textContent=`제${Number(set.value)}회 · ${part.selectedOptions[0].textContent}`;status.textContent='재생 버튼을 눌러 시작하세요.';review.open=false;review.hidden=!['s2','s3'].includes(part.value);if(!review.hidden)model.src=`hsk3-set${set.value}-${part.value}-model.mp3`;else model.removeAttribute('src');history.replaceState(null,'',`?set=${set.value}&part=${part.value}`)}
set.addEventListener('change',update);part.addEventListener('change',update);audio.addEventListener('error',()=>{status.textContent='음원을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도하세요.'});audio.addEventListener('play',()=>{model.pause();status.textContent='재생 중입니다.'});model.addEventListener('play',()=>audio.pause());update();
</script></html>
