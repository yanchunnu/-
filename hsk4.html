<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3.0 4급 모의고사 음원</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#eef4f6;color:#173a49;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:640px;margin:24px auto;padding:30px;background:#fff;border-radius:16px;border:1px solid #dce7ea}h1{font-size:28px;margin:8px 0 28px}h2{font-size:21px;line-height:1.5;margin:24px 0 10px}.eyebrow{font-size:14px;color:#597681}label{display:block;font-size:16px;margin:18px 0 8px}select{width:100%;font:inherit;padding:12px;background:#fff;color:inherit;border:1px solid #9bb3bc;border-radius:8px}audio{width:100%;margin:14px 0}p{font-size:16px;line-height:1.7}a{color:#125e78;text-underline-offset:4px}.note{font-size:14px;color:#5b727c;border-top:1px solid #dce7ea;padding-top:18px;margin-top:26px}.error{color:#9b2424}button{font:inherit;color:#125e78;background:#fff;border:1px solid #aac1ca;border-radius:7px;padding:9px 12px;margin-top:10px;cursor:pointer}:focus-visible{outline:3px solid #4397b8;outline-offset:3px}@media(max-width:400px){main{padding:22px 18px}h1{font-size:25px}}</style></head>
<body><main><div class="eyebrow">HSK3.0 · 4급 모의고사</div><h1>듣기 · 말하기 음원</h1><label for="set">회차</label><select id="set"></select><label for="part">영역과 부분</label><select id="part"><option value="l1">听力 第一部分 · 대화 듣기</option><option value="l2">听力 第二部分 · 단문 듣기</option><option value="s1">口语 第一部分 · 듣고 다시 말하기</option><option value="s2">口语 第二部分 · 사진 보고 말하기</option><option value="s3">口语 第三部分 · 질문에 답하기</option></select><h2 id="heading"></h2><audio id="audio" controls preload="metadata" aria-label="선택한 부분의 중국어 음원"></audio><p id="guidance"></p><p id="error" class="error" role="status" hidden>음원을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 재생하거나 아래 MP3 링크를 이용해 주세요.</p><button id="restart" type="button">처음부터 재생</button><p><a id="download" download>MP3 파일 열기 / 저장</a></p><p class="note">중국어 합성음성 · 학습용 음원<br>말하기에는 모범답안이 포함되지 않습니다. 답변 시간에는 음원 재생이 유지되며 소리가 나지 않습니다.</p></main>
<script>
const set=document.querySelector('#set'),part=document.querySelector('#part'),audio=document.querySelector('#audio'),heading=document.querySelector('#heading'),download=document.querySelector('#download'),error=document.querySelector('#error'),guidance=document.querySelector('#guidance');
for(let n=1;n<=10;n++){const o=document.createElement('option');o.value=n;o.textContent=`제${n}회`;set.append(o)}
const q=new URLSearchParams(location.search);set.value=String(Math.max(1,Math.min(10,parseInt(q.get('s'),10)||1)));part.value=['l1','l2','s1','s2','s3'].includes(q.get('p'))?q.get('p'):'l1';
const hints={l1:'1–14번 대화와 질문을 듣고 정답을 고르세요. 문항마다 6초의 답변 시간이 있습니다.',l2:'15–32번 단문과 질문을 듣고 정답을 고르세요. 질문마다 7초의 답변 시간이 있습니다.',s1:'71–72번 원문을 들은 뒤 자신의 말로 다시 말하세요. 문항마다 40초의 답변 시간이 있습니다.',s2:'73번 안내를 듣고 시험지의 사진 세 장을 연결해 이야기하세요. 답변 시간은 2분입니다.',s3:'74–75번 질문을 듣고 말로 답하세요. 문항마다 2분의 답변 시간이 있습니다.'};
function update(){audio.pause();const file=`hsk4-set${set.value.padStart(2,'0')}-${part.value}.mp3`;audio.src=file;download.href=file;heading.textContent=`제${set.value}회 · ${part.selectedOptions[0].textContent}`;guidance.textContent=hints[part.value];document.title=heading.textContent+' | HSK3.0 4급';error.hidden=true;history.replaceState(null,'',`?s=${set.value}&p=${part.value}`)}
set.addEventListener('change',update);part.addEventListener('change',update);audio.addEventListener('error',()=>error.hidden=false);document.querySelector('#restart').addEventListener('click',()=>{audio.currentTime=0;audio.play().catch(()=>error.hidden=false)});update();
</script></body></html>
