<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3.0 2급 · 부분별 듣기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#173b4b;font-family:system-ui,sans-serif}main{max-width:600px;margin:auto;padding:36px 24px}h1{font-size:30px}label{display:block;font-weight:600;margin:20px 0 8px}select{width:100%;padding:12px;border:1px solid #adc0c8;border-radius:8px;background:white;font-size:17px;color:inherit}article{background:white;padding:24px;margin:24px 0;border-radius:12px;border:1px solid #dce5e9}button{background:#18536b;color:white;border:0;border-radius:6px;padding:13px 20px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#restart{background:#eaf1f4;color:#18536b}input[type=range]{width:100%;margin:25px 0 10px;accent-color:#18536b}p{line-height:1.7;color:#536773}#clock{font-variant-numeric:tabular-nums}footer{font-size:13px;color:#607580}</style>
<main><small>HSK3.0 2급 모의고사</small><h1>부분별 듣기</h1><label for="set">회차 선택</label><select id="set"></select><label for="part">듣기 부분 선택</label><select id="part"><option value="0">전체 듣기 · 1–25번</option><option value="1">第一部分 · 1–5번</option><option value="2">第二部分 · 6–15번</option><option value="3">第三部分 · 16–25번</option></select><article><h2 id="title">음원 불러오는 중</h2><p id="description"></p><audio id="player" preload="metadata"></audio><button id="play" disabled>재생</button> <button id="restart" disabled>처음부터</button><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="선택한 부분의 재생 위치" disabled><div id="clock">0:00 / 0:00</div><p id="status" role="status"></p></article><p>재생 버튼을 누르면 선택한 부분만 재생합니다. 각 문항은 두 번 읽으며, 해당 부분이 끝나면 자동으로 멈춥니다.</p><footer>중국어 합성음성으로 제작한 학습용 음원입니다.</footer></main>
<script>
const set=document.querySelector('#set'),part=document.querySelector('#part'),audio=document.querySelector('#player'),play=document.querySelector('#play'),restart=document.querySelector('#restart'),seek=document.querySelector('#seek'),status=document.querySelector('#status');
for(let i=1;i<=10;i++)set.add(new Option(`제${i}회`,i));
const names=['전체 듣기','第一部分','第二部分','第三部分'],ranges=['1–25번','1–5번','6–15번','16–25번'];let rows=[],start=0,end=0,ready=false,ended=false,frame=0;
const time=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function paint(){let t=Math.max(0,Math.min(end-start,audio.currentTime-start));seek.value=t;document.querySelector('#clock').textContent=`${time(t)} / ${time(end-start)}`;play.textContent=audio.paused?'재생':'일시정지'}
function stopAtEnd(){audio.pause();ended=true;seek.value=end-start;document.querySelector('#clock').textContent=`${time(end-start)} / ${time(end-start)}`;status.textContent='선택한 부분의 듣기가 끝났습니다.';play.textContent='다시 재생'}
function tick(){if(audio.currentTime>=end-.04){stopAtEnd();return}paint();if(!audio.paused)frame=requestAnimationFrame(tick)}
function prepare(){audio.currentTime=start;ready=true;play.disabled=restart.disabled=seek.disabled=false;status.textContent='재생 버튼을 눌러 시작하세요.';paint()}
function choose(){audio.pause();cancelAnimationFrame(frame);ended=false;ready=false;play.disabled=restart.disabled=seek.disabled=true;const n=Number(set.value),p=Number(part.value),row=rows[n-1];start=p?row.parts[p-1]:0;end=p&&p<3?row.parts[p]:row.seconds;seek.max=end-start;seek.value=0;document.querySelector('#title').textContent=`제${n}회 · ${names[p]}`;document.querySelector('#description').textContent=`${ranges[p]} · ${time(end-start)}`;history.replaceState(null,'',`?set=${n}&part=${p}`);status.textContent='음원을 불러오는 중입니다.';document.querySelector('#clock').textContent=`0:00 / ${time(end-start)}`;audio.src=row.file;audio.load()}
audio.addEventListener('loadedmetadata',prepare);
audio.addEventListener('error',()=>{status.textContent='음원을 불러오지 못했습니다. 새로고침해 주세요.'});
audio.addEventListener('play',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)});
audio.addEventListener('pause',()=>{cancelAnimationFrame(frame);if(!ended)paint()});
audio.addEventListener('timeupdate',()=>{if(!ready)return;if(audio.currentTime>=end-.04)stopAtEnd();else if(!ended)paint()});
play.onclick=async()=>{if(!ready)return;if(!audio.paused){audio.pause();return}if(ended||audio.currentTime>=end-.1||audio.currentTime<start){audio.currentTime=start;ended=false}status.textContent='';try{await audio.play()}catch{status.textContent='재생 버튼을 다시 눌러 주세요.'}};
restart.onclick=()=>{audio.pause();ended=false;audio.currentTime=start;status.textContent='처음으로 돌아왔습니다.';paint()};
seek.oninput=()=>{ended=false;audio.currentTime=start+Math.min(Number(seek.value),end-start-.05);paint()};set.onchange=choose;part.onchange=choose;
fetch('audio.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{rows=data;const q=new URLSearchParams(location.search);set.value=Math.max(1,Math.min(10,parseInt(q.get('set'))||1));part.value=Math.max(0,Math.min(3,parseInt(q.get('part'))||0));choose()}).catch(()=>{status.textContent='음원 목록을 불러오지 못했습니다. 새로고침해 주세요.'});
</script></html>
