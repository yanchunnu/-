<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3.0 2급 · 듣기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#173b4b;font-family:system-ui,sans-serif}main{max-width:600px;margin:0 auto;padding:40px 24px}small{letter-spacing:.06em}h1{font-size:32px;margin:16px 0 28px}label{display:block;font-weight:600;margin-bottom:10px}select{width:100%;padding:14px;border:1px solid #adc0c8;border-radius:8px;background:white;font-size:18px;color:inherit}article{background:white;padding:24px;margin:24px 0;border-radius:12px;border:1px solid #dce5e9}audio{width:100%;margin:12px 0}button{background:#eaf1f4;border:0;border-radius:6px;padding:12px;color:#174c63;font-size:15px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.8;color:#536773}a{color:#18536b}footer{font-size:13px;color:#607580}</style><main><small>HSK3.0 2급 모의고사</small><h1>듣기 연습</h1><label for="set">회차 선택</label><select id="set"></select><article><h2 id="title"></h2><p id="duration"></p><audio id="player" controls preload="metadata"></audio><nav aria-label="부분별 이동"><button data-p="0">1부분 · 1–5번</button><button data-p="1">2부분 · 6–15번</button><button data-p="2">3부분 · 16–25번</button></nav><p><a id="download" download>음원 내려받기</a></p></article><p>재생 버튼을 눌러 시작하세요. 각 문제는 두 번 읽으며, 문제 사이에 답을 고를 시간이 있습니다. 문제집을 보면서 들어 주세요.</p><footer>중국어 합성음성으로 제작한 학습용 음원입니다.</footer></main><script>const select=document.querySelector('#set'),audio=document.querySelector('audio');for(let i=1;i<=10;i++)select.add(new Option(`제${i}회`,i));let rows=[];function choose(n){const row=rows[n-1];select.value=n;document.querySelector('#title').textContent=`제${n}회 듣기`;document.querySelector('#duration').textContent=`25문항 · 약 ${Math.ceil(row.seconds/60)}분`;audio.src=row.file;document.querySelector('#download').href=audio.src;history.replaceState(null,'','?set='+n)}fetch('audio.json').then(r=>r.json()).then(data=>{rows=data;choose(Math.max(1,Math.min(10,Number(new URLSearchParams(location.search).get('set'))||1)))}).catch(()=>document.querySelector('#title').textContent='음원을 불러오지 못했습니다. 새로고침해 주세요.');select.onchange=()=>choose(Number(select.value));document.querySelectorAll('button').forEach(b=>b.onclick=()=>{audio.currentTime=rows[select.value-1].parts[Number(b.dataset.p)];audio.play()});</script></html>
